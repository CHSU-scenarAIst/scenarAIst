# обязательно
completion:
  provider: gigachat
  api_key: sk-or-v1-...

  # по умолчанию
  verify_ssl_certs: false # для GigaChat в домашних условиях должен быть 'false'
  base_url: http://localhost:1234/v1 # для каждого провайдера свой
  model: GigaChat-2 # для каждого провайдера свой
  temperature: 0.2
  max_tokens: 4000
  max_steps: 20
  timeout: 60
  system_prompt: |
    You are a helpful assistant. Respond in the same language as the user's request.

# необязательно
embeddings:
  # обязательно
  provider: gigachat

  # по умолчанию
  api_key: None
  verify_ssl_certs: false # для GigaChat в домашних условиях должен быть 'false'
  base_url: http://localhost:1234/v1 # для каждого провайдера свой
  model: intfloat/multilingual-e5-large # для каждого провайдера свой
  dim: 1024 # для каждой модели свои параметры
  db_path: ./rag.sqlite3
  batch_size: 4
  timeout: 60

  # обязательно
  collections:
    - name: Инструкции
      path: ./docs/instruct

      # по умолчанию
      top_k: 5
      chunk_size: 512
      chunk_overlap: 64

# необязательно - поиск в Интернете
tavily:
  # обязательно
  api_key: tvly-dev-...

  # по умолчанию
  top_k: 3
