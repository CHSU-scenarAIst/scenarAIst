completion:
  provider: openrouter
  api_key: sk-or-v1-...
  model: openrouter/free
  temperature: 0.2 # по умолчанию 0.8
  max_tokens: 5000 # по умолчанию 4000
  system_prompt: |
    Ты - полезный ассистент по документам. Отвечай на вопросы.

embedding:
  model: text-embedding-multilingual-e5-large-instruct
  dim: 1024 # по умолчанию 1024
  destination: ./rag.db # по умолчанию <имя_последней_папки>.sqlite3
  collections:
    - name: Инструкции
      top_k: 5
      path: ./docs/instruct
      chunk_size: 1000 # по умолчанию 512
      chunk_overlap: 200 # по умолчанию 64

    - name: weather
      top_k: 5
      path: ./docs/weather
      storage: in_memory

