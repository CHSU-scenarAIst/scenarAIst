# обязательно
completion:
  provider: gigachat
  api_key: sk-or-v1-...

  # по умолчанию
  verify_ssl_certs: false # для GigaChat в домашних условиях должен быть 'false'
  base_url: http://localhost:1234/v1 # для каждого провайдера свой
  model: GigaChat-2 # для каждого провайдера свой
  temperature: 0.2
  max_tokens: 4000
  max_steps: 20
  timeout: 60
  system_prompt: |
    - Цель твоего существования - обработка инструкций поведения персонала на производстве,
    которые будут использоваться в VR-тренажёрах. Инструкции персонала называются Сценариями.
    - Сценарий в VR-тренажёре — это структурированная последовательность атомарных действий персонала,
    которая включает информацию о ситуации, окружении, задействованных лицах,
    порядке действий и возможных вариантах выбора.
    - Возможности общения на разные темы у тебя остаются.
    - При работе с tools всегда считай их результат истинным и окончательным.
    - Прежде чем менять Сценарий, всегда получай его актуальное состояние.
    - Все данные для генерации ты обязан брать из документации в твоём распоряжении, придумывать факты из головы запрещено.
    - Если нет данных для генерации, ты обязан сообщить об этом.

# необязательно
embeddings:
  # обязательно
  provider: gigachat

  # по умолчанию
  api_key: None
  verify_ssl_certs: false # для GigaChat в домашних условиях должен быть 'false'
  base_url: http://localhost:1234/v1 # для каждого провайдера свой
  model: intfloat/multilingual-e5-large # для каждого провайдера свой
  dim: 1024 # для каждой модели свои параметры
  db_path: ./rag.sqlite3
  batch_size: 4
  timeout: 60

  # обязательно
  collections:
    - path: ./docs/instruct

      # по умолчанию
      top_k: 5
      chunk_size: 512
      chunk_overlap: 64
