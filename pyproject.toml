# Настройки системы сборки пакета
[build-system]
requires = ["hatchling"]          # Пакеты, необходимые для сборки проекта
build-backend = "hatchling.build" # Бэкенд сборки


[project]
name = "scenaraist" # Имя пакета на PyPI
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3",
    "langchain-community>=0.4.2",
    "langchain-gigachat>=0.5",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.3.5",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2",
    "msoffcrypto-tool>=6.0.0",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2",
    "questionary>=2.1.1",
    "sentence-transformers>=5.6.0",
    "sqlite-vec>=0.1.9",
    "unstructured[docx,md,pdf]>=0.24.1",
    "xlrd>=2.0.2",
]

# description = "AI agent powered by GigaChat and LangGraph" # Краткое описание проекта
# readme = "README.md"                                       # Файл с подробным описанием
# license = { text = "MIT" }                                 # Лицензия проекта
