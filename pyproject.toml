# [project.urls]
# Homepage = "https://github.com/example/scenaraist"
# Repository = "https://github.com/example/scenaraist.git"
# Documentation = "https://github.com/example/scenaraist#readme"

[project.scripts]
scenaraist = "scenaraist.__main__:main"

# Группы необязательных зависимостей
[dependency-groups]
dev = [
    "mypy>=2.2.0",           # Статическая проверка типов
    "pre-commit>=4.6.0",     # Git hooks
    "pytest>=9.1.1",         # Тестирование
    "pytest-cov>=7.1.0",     # Покрытие тестами
    "ruff>=0.15.21",         # Линтер и форматтер
    "types-python-dateutil", # Типы для python-dateutil
]


# Настройки сборки wheel
[tool.hatch.build.targets.wheel]
packages = ["src/scenaraist"] # Пакеты, которые попадут в wheel


[tool.coverage.run]
source = ["scenaraist"]


# Настройки mypy
[tool.mypy]
python_version = "3.13"         # Версия Python для анализа
warn_return_any = true          # Предупреждать при возврате Any
warn_unused_configs = true      # Предупреждать о неиспользуемых настройках
ignore_missing_imports = false
strict = true                   # Максимально строгий режим проверки
files = ["src", "tests"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_any_expr = true
disallow_any_unimported = true
check_untyped_defs = true
no_implicit_reexport = true


# Настройки pytest
[tool.pytest.ini_options]
testpaths = ["src/tests"]    # Где искать тесты
python_files = ["test_*.py"] # Какие файлы считать тестами
pythonpath = ["src"]
