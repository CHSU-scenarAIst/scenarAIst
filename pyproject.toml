# Настройки системы сборки пакета
[build-system]
requires = ["hatchling"]          # Пакеты, необходимые для сборки проекта
build-backend = "hatchling.build" # Бэкенд сборки

[project]
name = "scenaraist"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "langchain>=1.3",
    "langchain-community>=0.4.2",
    "langchain-gigachat>=0.5",
    "langchain-openai>=1.3.5",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2",
    # "msoffcrypto-tool>=6.0.0",
    # "networkx>=3.6.1",
    # "openpyxl>=3.1.5",
    # "pandas>=3.0.3",
    # "pymupdf>=1.28.0",
    # "sentence-transformers>=5.6.0",
    "sqlite-vec>=0.1.9",
    # "unstructured[docx,md,pdf]>=0.24.1",
    # "xlrd>=2.0.2",
    "pyside6>=6.10,<6.11",
]

[project.scripts]
scenaraist = "scenaraist.__main__:main"

# Настройки сборки wheel
[tool.hatch.build.targets.wheel]
packages = ["src/scenaraist"]
include = ["src/scenaraist/qml"]


[tool.coverage.run]
source = ["scenaraist"]

# Группы необязательных зависимостей
[dependency-groups]
dev = [
    "mypy>=2.2.0",                # Статическая проверка типов
    "pre-commit>=4.6.0",          # Git hooks
    "pytest>=9.1.1",              # Тестирование
    "pytest-cov>=7.1.0",          # Покрытие тестами
    "ruff>=0.15.21",              # Линтер и форматтер
    "types-python-dateutil>=2.9", # Типы для python-dateutil
]

# Настройки mypy
[tool.mypy]
python_version = "3.13"        # Версия Python для анализа
strict = true                  # Максимально строгий режим проверки
warn_return_any = true         # Предупреждать при возврате Any
warn_unused_configs = true     # Предупреждать о неиспользуемых настройках
ignore_missing_imports = false
files = ["src", "tests"]

# Настройки pytest
[tool.pytest.ini_options]
testpaths = ["tests"]        # Где искать тесты
python_files = ["test_*.py"] # Какие файлы считать тестами
pythonpath = ["src"]
