target-version = "py314" # Версия Python, под которую проверяется код
line-length = 100        # Максимальная длина строки


[lint]
# Какие наборы правил использовать
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit security
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "RUF", # собственные правила Ruff
]


[lint.per-file-ignores]
"__init__.py" = ["F401"] # Разрешить реэкспорт через __init__.py
"tests/**/*" = ["S101"]  # Разрешить assert в тестах
"./*" = ["RUF001"]


[format]
quote-style = "double" # Использовать двойные кавычки
indent-style = "space" # Использовать пробелы вместо табов
line-ending = "auto"   # Автоматически определять окончания строк
