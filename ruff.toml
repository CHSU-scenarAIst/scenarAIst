# ! NOTTODO вернуть комментарии в строки
# Версия Python, под которую проверяется код
target-version = "py313"
# Максимальная длина строки
line-length = 110

[lint]
# Какие наборы правил использовать
select = [
    # pycodestyle errors
    "E",
    # pycodestyle warnings
    "W",
    # pyflakes
    "F",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # bandit security
    "S",
    # flake8-bugbear
    "B",
    # Pylint
    "PL",
    # flake8-simplify
    "SIM",
    # flake8-type-checking
    "TCH",
    # flake8-comprehensions
    "C4",
    # flake8-return
    "RET",
    # собственные правила Ruff
    "RUF",
    # missing-return-type-undocumented-public-function
    "ANN201",
]

[lint.per-file-ignores]
# Разрешить реэкспорт через __init__.py
"__init__.py" = ["F401"]
# Разрешить assert в тестах
"tests/**/*" = ["S101"]
# Отключить проверку русского текста
"./*" = ["RUF001", "RUF002", "RUF003"]

[format]
# Использовать двойные кавычки
quote-style = "double"
# Использовать пробелы вместо табов
indent-style = "space"
# Автоматически определять окончания строк
line-ending = "auto"
# Всегда добавлять запятую в многострочных структурах
skip-magic-trailing-comma = false
